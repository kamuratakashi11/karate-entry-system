<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>審査用紙の印刷</title>
<style>
  /* 審査用紙の地紙（審査部会の PDF を画像にしたもの）に、申込の内容を重ねて刷る。
     様式は審査部会が作っているので、原紙のアプリに合わせなくてよい（方針 2026-10-13） */
  @page { size: A4; margin: 0; }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ebf0; color: #111;
    font-family: "Yu Gothic Medium","游ゴシック Medium","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #c8cfdb;
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
  .bar b { font-weight: 600; }
  .bar .hint { font-size: 12.5px; color: #515b6d; width: 100%; margin: 0; }
  .bar button { font: inherit; cursor: pointer; padding: 7px 18px; border-radius: 3px;
    background: #2e4a7d; color: #fff; border: 1px solid #2e4a7d; font-weight: 600; }
  .err { margin: 16px; padding: 10px 14px; background: #fbeae8; color: #a8322a; border: 1px solid #a8322a; }
  .pages { padding: 16px 0 40px; }
  .page { position: relative; width: 210mm; height: 297mm; margin: 0 auto 12px; background: #fff;
    overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.12); break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }
  .page img { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 文字は「下線の上に乗る」ように、箱の下端（bottom）で位置を合わせる */
  .f { position: absolute; height: 7mm; display: flex; align-items: flex-end; white-space: nowrap;
    font-size: 4.3mm; line-height: 1; }
  .f.c { justify-content: center; }
  .mark { position: absolute; width: 6.4mm; height: 6.4mm; border: .35mm solid #111; border-radius: 50%; }
  .set { position: absolute; right: 8mm; bottom: 6mm; font-size: 2.6mm; color: #555; }
  @media print {
    body { background: #fff; }
    .bar, .err { display: none; }
    .pages { padding: 0; }
    .page { margin: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="bar" id="bar">
  <span id="info">読み込み中…</span>
  <button id="btn-print" disabled>印刷する</button>
  <p class="hint">印刷の画面で <b>用紙 A4</b>・<b>倍率 100%（「実際のサイズ」）</b>・<b>余白なし</b>を選んでください。
    1 人 3 枚（審査員 3 人ぶん）を、受審番号の順に 1 組ずつ・3 組続けて刷ります。</p>
</div>
<div id="err" class="err" hidden></div>
<div class="pages" id="pages"></div>
<script src="shinsa_print.js"></script>
</body>
</html>
